name: Feature request
description: Propose a scoped improvement
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or interoperability problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired behavior and public API, if relevant.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Protocol evidence
      description: For wire changes, identify the evidence level and peer version described in docs/PROTOCOL_PROVENANCE.md.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This proposal does not depend on unauthorized access or undisclosed proprietary material.
          required: true
