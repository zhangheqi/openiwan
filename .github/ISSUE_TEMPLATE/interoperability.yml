name: Interoperability report
description: Report behavior observed with an authorized iWAN deployment
title: "interop: "
labels: ["interoperability"]
body:
  - type: markdown
    attributes:
      value: |
        Interoperability evidence improves the protocol reference. Share only
        information you are authorized to disclose, and redact all private data.
  - type: input
    id: client
    attributes:
      label: Peer or deployment version
      placeholder: "Server, controller, or peer version; use Unknown if unavailable"
  - type: input
    id: openiwan
    attributes:
      label: openiwan version
      placeholder: "0.2.0 or commit SHA"
    validations:
      required: true
  - type: dropdown
    id: evidence
    attributes:
      label: Evidence level
      description: See docs/PROTOCOL_PROVENANCE.md.
      options:
        - Protocol analysis (S)
        - Independent cross-check (C)
        - Synthetic local endpoint (L)
        - Authorized real endpoint (R)
    validations:
      required: true
  - type: textarea
    id: observation
    attributes:
      label: Observation
      description: State the smallest specific behavior that was observed.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction or synthetic example
    validations:
      required: true
  - type: checkboxes
    id: authorization
    attributes:
      label: Authorization and privacy
      options:
        - label: I was authorized to perform the described testing.
          required: true
        - label: I removed credentials, tokens, private responses, and identifying packet data.
          required: true
