name: Interoperability report
description: Report Panabit iWAN protocol behavior or authorized interoperability evidence
title: "interop: "
labels: ["interoperability"]
body:
  - type: markdown
    attributes:
      value: |
        Interoperability evidence improves the protocol reference. Share only
        information you are authorized to disclose, and redact all private data.
  - type: input
    id: panabit
    attributes:
      label: Panabit iWAN software and version
      description: Identify the official client, server, or controller where the behavior was observed.
      placeholder: "For example: Android client 2.3.0, controller version, or Unknown"
    validations:
      required: true
  - type: input
    id: openiwan
    attributes:
      label: OpeniWAN version or commit
      description: Optional; fill this only if you reproduced the behavior with OpeniWAN.
      placeholder: "openiwan 0.3.0 or commit SHA"
  - type: dropdown
    id: evidence
    attributes:
      label: Evidence level
      description: See docs/PROTOCOL_PROVENANCE.md.
      options:
        - Protocol analysis (S)
        - Independent cross-check (C)
        - Synthetic local endpoint (L)
        - Authorized real endpoint (R)
    validations:
      required: true
  - type: textarea
    id: observation
    attributes:
      label: Observation
      description: State the smallest specific behavior that was observed.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction or synthetic example
    validations:
      required: true
  - type: checkboxes
    id: authorization
    attributes:
      label: Authorization and privacy
      options:
        - label: I was authorized to perform the described testing.
          required: true
        - label: I removed credentials, tokens, private responses, and identifying packet data.
          required: true
