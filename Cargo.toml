[package]
name = "openiwan"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "An independently implemented iWAN client and protocol library"
documentation = "https://docs.rs/openiwan"
license = "MIT"
readme = "README.md"
keywords = ["iwan", "vpn", "tunnel", "sdwan"]
categories = ["network-programming", "command-line-utilities"]

[lib]
name = "openiwan"
path = "src/lib.rs"

[[bin]]
name = "openiwan"
path = "src/bin/openiwan.rs"

[dependencies]
aes = "0.8"
cipher = "0.4"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
libc = "0.2"
md-5 = "0.10"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
zeroize = "1.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
return_self_not_must_use = "allow"
